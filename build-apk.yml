name: Spacemate APK Builder

on:
  workflow_dispatch:
    inputs:
      project_url:
        description: "Public URL of Android project ZIP"
        required: true
        type: string
      artifact_name:
        description: "APK artifact name"
        required: true
        default: "spacemate-app"
        type: string

permissions:
  contents: read
  actions: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Download Android Project
        run: |
          curl --fail --location "${{ inputs.project_url }}" --output project.zip
          mkdir -p project
          unzip -q project.zip -d project

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build APK
        working-directory: project
        run: gradle --no-daemon assembleDebug

      - name: Check APK
        run: |
          test -f project/app/build/outputs/apk/debug/app-debug.apk
          ls -lh project/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
