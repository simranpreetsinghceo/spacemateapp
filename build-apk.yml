name: Spacemate APK Builder

on:
  workflow_dispatch:
    inputs:
      project_url:
        description: "Public URL of Android project ZIP"
        required: true
        type: string
      artifact_name:
        description: "APK artifact name"
        required: true
        default: "spacemate-app"
        type: string

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Download project
        shell: bash
        run: |
          set -euxo pipefail
          curl -fL --retry 3 "${{ inputs.project_url }}" -o project.zip
          unzip -t project.zip
          mkdir -p project
          unzip -q project.zip -d project
          find project -maxdepth 4 -type f | sort | head -200

      - name: Detect project root
        id: root
        shell: bash
        run: |
          set -euxo pipefail
          SETTINGS="$(find project -maxdepth 5 -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"
          if [ -z "$SETTINGS" ]; then
            echo "::error::Android settings.gradle/settings.gradle.kts not found."
            exit 1
          fi
          ROOT="$(dirname "$SETTINGS")"
          echo "dir=$ROOT" >> "$GITHUB_OUTPUT"
          echo "Android project root: $ROOT"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        shell: bash
        run: |
          set -euxo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Configure Android SDK
        shell: bash
        working-directory: ${{ steps.root.outputs.dir }}
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Build APK
        id: gradle
        shell: bash
        working-directory: ${{ steps.root.outputs.dir }}
        run: |
          set -o pipefail

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon --stacktrace assembleDebug 2>&1 | tee "$GITHUB_WORKSPACE/gradle-build.log"
          else
            echo "Gradle wrapper not found; installing Gradle 8.7."
            wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip -O /tmp/gradle.zip
            unzip -q /tmp/gradle.zip -d /opt
            /opt/gradle-8.7/bin/gradle --no-daemon --stacktrace assembleDebug 2>&1 | tee "$GITHUB_WORKSPACE/gradle-build.log"
          fi

      - name: Locate APK
        id: apk
        shell: bash
        run: |
          set -euxo pipefail
          APK="$(find "${{ steps.root.outputs.dir }}" -type f -name "*.apk" -path "*/build/outputs/apk/*" -print -quit)"
          if [ -z "$APK" ]; then
            echo "::error::Build completed but no APK file was found."
            find "${{ steps.root.outputs.dir }}" -type f -path "*/build/outputs/*" -print || true
            exit 1
          fi
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: spacemate-build-error-log
          path: gradle-build.log
          if-no-files-found: ignore
          retention-days: 7
